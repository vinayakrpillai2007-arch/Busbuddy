services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: busbuddy
      POSTGRES_USER: busbuddy
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "5432:5432"
    volumes:
      - busbuddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busbuddy -d busbuddy"]
      interval: 5s
      timeout: 4s
      retries: 10

volumes:
  busbuddy_pgdata: